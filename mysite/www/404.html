{% extends "templates/web.html" %}

{%- block title -%}{{ _("Page Not Found") }}{%- endblock -%}

{% block page_content %}
<script>
  window.is_404 = true;
</script>

<section class="nf-wrap" dir="rtl">
  <div class="nf-bg" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div class="nf-shell">
    <div class="nf-code" aria-hidden="true">
      <span class="digit">4</span>
      <span class="digit zero">0</span>
      <span class="digit">4</span>
    </div>

    <h1>صفحه پیدا نشد</h1>
    <p class="nf-lead">
      احتمالاً آدرس تغییر کرده یا اشتباه وارد شده. با دکمه‌های زیر سریع برگرد.
    </p>

    <div class="nf-actions">
      <a href="/" class="nf-btn nf-btn-primary">بازگشت به خانه</a>
      <a href="/categories" class="nf-btn nf-btn-ghost">رفتن به دسته‌بندی‌ها</a>
    </div>

    <div class="nf-pulse" aria-hidden="true"></div>
  </div>
</section>

<style>
  .web-page-content {
    padding-top: 0 !important;
    padding-bottom: 0 !important;
  }

  .nf-wrap {
    --nf-bg: #f8f5f0;
    --nf-text: #2f2118;
    --nf-muted: rgba(54, 37, 26, 0.66);
    --nf-accent: #c98f4d;
    --nf-accent-strong: #71462f;
    --nf-border: rgba(123, 86, 58, 0.24);
    --nf-glass: rgba(255, 255, 255, 0.44);
    --nf-shadow: 0 28px 64px rgba(76, 48, 26, 0.16);
    min-height: calc(100vh - 120px);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    background: var(--nf-bg);
    padding: 64px 16px;
  }

  [data-theme='dark'] .nf-wrap {
    --nf-bg: #f5f1ea;
    --nf-text: #2f2118;
    --nf-muted: rgba(54, 37, 26, 0.68);
    --nf-accent: #bf8341;
    --nf-accent-strong: #6a422d;
    --nf-border: rgba(123, 86, 58, 0.28);
    --nf-glass: rgba(255, 255, 255, 0.5);
    --nf-shadow: 0 30px 66px rgba(76, 48, 26, 0.18);
  }

  .nf-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.42;
    animation: float 15s ease-in-out infinite alternate;
  }

  .blob-a {
    width: 420px;
    height: 420px;
    top: -90px;
    right: -80px;
    background: radial-gradient(circle, rgba(206, 154, 95, 0.9) 0%, rgba(206, 154, 95, 0) 72%);
  }

  .blob-b {
    width: 480px;
    height: 480px;
    left: -120px;
    bottom: -140px;
    background: radial-gradient(circle, rgba(161, 112, 79, 0.62) 0%, rgba(161, 112, 79, 0) 72%);
    animation-delay: 1.8s;
  }

  .blob-c {
    width: 280px;
    height: 280px;
    left: 46%;
    top: 22%;
    background: radial-gradient(circle, rgba(241, 208, 173, 0.74) 0%, rgba(241, 208, 173, 0) 72%);
    animation-delay: 3s;
  }

  .nf-shell {
    width: min(760px, 100%);
    background: linear-gradient(145deg, var(--nf-glass) 0%, rgba(255, 255, 255, 0.24) 100%);
    border: 1px solid var(--nf-border);
    border-radius: 34px;
    box-shadow: var(--nf-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.58);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    padding: 44px 34px 40px;
    text-align: center;
    position: relative;
    z-index: 2;
    overflow: hidden;
  }

  .nf-shell::before {
    content: "";
    position: absolute;
    inset: -50% -20% auto;
    height: 220px;
    background: linear-gradient(120deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.44), rgba(255, 255, 255, 0));
    transform: rotate(-8deg);
    animation: sheen 5.8s linear infinite;
    pointer-events: none;
  }

  .nf-code {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .digit {
    width: 92px;
    height: 112px;
    border-radius: 24px;
    display: grid;
    place-items: center;
    font-size: 64px;
    font-weight: 950;
    color: var(--nf-accent-strong);
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.34) 100%);
    border: 1px solid rgba(255, 255, 255, 0.74);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 12px 24px rgba(103, 70, 45, 0.16);
    animation: bob 2.8s ease-in-out infinite;
  }

  .digit.zero {
    animation-delay: 0.3s;
    color: var(--nf-accent);
  }

  .digit:last-child {
    animation-delay: 0.6s;
  }

  .nf-shell h1 {
    margin: 0;
    color: var(--nf-text);
    font-size: clamp(34px, 5vw, 56px);
    font-weight: 980;
    line-height: 1.08;
  }

  .nf-lead {
    margin: 14px auto 28px;
    max-width: 530px;
    color: var(--nf-muted);
    font-size: clamp(15px, 1.6vw, 18px);
    line-height: 1.9;
  }

  .nf-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .nf-btn {
    text-decoration: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 820;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
  }

  .nf-btn-primary {
    background: linear-gradient(135deg, var(--nf-accent) 0%, #b97f45 100%);
    color: #fff;
    box-shadow: 0 14px 28px rgba(171, 118, 67, 0.3);
  }

  .nf-btn-ghost {
    color: var(--nf-accent-strong);
    border: 1px solid var(--nf-border);
    background: rgba(255, 255, 255, 0.72);
  }

  .nf-btn:hover {
    transform: translateY(-2px);
  }

  .nf-pulse {
    position: absolute;
    width: 300px;
    height: 300px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.36);
    pointer-events: none;
    z-index: -1;
    animation: pulse 3.8s ease-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(28px, -24px) scale(1.08); }
  }

  @keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(0.86); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(1.26); opacity: 0; }
  }

  @keyframes sheen {
    0% { transform: translateX(-130%) rotate(-8deg); }
    100% { transform: translateX(150%) rotate(-8deg); }
  }

  @media (max-width: 768px) {
    .nf-wrap {
      min-height: calc(100vh - 72px);
      padding: 34px 12px;
    }

    .nf-shell {
      border-radius: 24px;
      padding: 32px 18px 28px;
    }

    .digit {
      width: 70px;
      height: 86px;
      border-radius: 18px;
      font-size: 46px;
    }

    .nf-lead {
      margin-bottom: 22px;
      line-height: 1.8;
    }

    .nf-actions {
      flex-direction: column;
    }

    .nf-btn {
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
    }
  }
</style>
{% endblock %}
