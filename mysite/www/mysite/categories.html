<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>دسته‌بندی محصولات | DenRoom</title>

    <!-- Peyda Font (local) -->
    <style>
        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/peyda-extralight.ttf') format('truetype');
            font-weight: 200;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/peyda-light.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Pevda-Reqular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-ExtraBold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Black.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }
    </style>

    <style>
        * {
            font-family: 'Peyda', Tahoma, sans-serif !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #503130 0%, #3d2524 100%);
            z-index: 999999;
            transition: opacity 0.3s ease;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #f2c97e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading-screen h1 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 1.5rem;
        }

        #loading-screen p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
    </style>

    <!-- Vue App Assets -->
    <script type="module" crossorigin src="/assets/mysite/frontend/assets/index.js?v=1.0.1"></script>
    <link rel="stylesheet" href="/assets/mysite/frontend/assets/index.css?v=1.0.1">
    <meta name="description" content="دسته‌بندی محصولات در دن‌روم؛ اطلاعات کامل این صفحه، معرفی محتوا و دسترسی سریع به بخش‌های مرتبط سایت." />
    <meta name="robots" content="index,follow" />
</head>

<body class="h-full">
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <h1>DenRoom</h1>
        <p>در حال بارگذاری...</p>
    </div>

    <!-- Vue App Mount Point -->
    <div id="app" class="h-full"></div>

    <!-- Boot Data from Frappe -->
    <script>
        // Page identifier
        window._PAGE = 'categories';

        {% for key in boot %}
        window["{{ key }}"] = {{ boot[key] | tojson }};
        {% endfor %}

        // Hide loading screen
        window.addEventListener('load', function () {
            setTimeout(function () {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('fade-out');
                    setTimeout(function () { ls.remove(); }, 300);
                }
            }, 600);
        });
    </script>
</body>

</html>
