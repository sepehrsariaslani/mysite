<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="stylesheet" href="/assets/mysite/frontend/assets/index.css?v=1.0.1">
    <link rel="icon" type="image/x-icon" href="/assets/mysite/images/favicon.ico">
    <style>
        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/peyda-extralight.ttf') format('truetype');
            font-weight: 200;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/peyda-light.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Pevda-Reqular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-ExtraBold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Black.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Peyda', sans-serif;
            background-color: #ffffff;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #503130 0%, #3d2524 100%);
            z-index: 999999;
            transition: opacity 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f2c97e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #f2c97e;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">DenRoom</div>
        <div style="color: rgba(255,255,255,0.7); font-size: 14px;">در حال بارگذاری...</div>
    </div>

    <div id="app"></div>

    <script>
        window._PAGE = "{{ page_name }}";
        window.addEventListener('load', function () {
            setTimeout(function () {
                var loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.classList.add('fade-out');
                    setTimeout(function () { loader.remove(); }, 400);
                }
            }, 600);
        });
    </script>
    <script type="module" src="/assets/mysite/frontend/assets/index.js?v=1.0.1"></script>
</body>

</html>
