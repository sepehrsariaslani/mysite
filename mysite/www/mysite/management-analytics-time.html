<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>مقایسه زمانی | آنالیتیکس مدیریت | DenRoom</title>

    <style>
        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Black.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            font-family: 'Peyda', Tahoma, sans-serif !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0d0b0a;
            overflow: hidden;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #3d2524 0%, #1a1312 100%);
            z-index: 999999;
            transition: opacity 0.35s ease;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #f2c97e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <script type="module" crossorigin src="/assets/mysite/frontend/assets/index.js"></script>
    <link rel="stylesheet" href="/assets/mysite/frontend/assets/index.css">
    <meta name="description" content="مقایسه زمانی؛ پنل مدیریت دن‌روم برای مشاهده گزارش‌ها، تنظیمات صفحات و کنترل بخش‌های مدیریتی سایت." />
    <meta name="robots" content="index,follow" />
</head>

<body class="h-full">
    <div id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <div id="app" class="h-full"></div>

    <script>
        window._PAGE = "management-analytics-time";
        window.csrf_token = {{ (csrf_token | default('', true) | string) | tojson }};

        window.addEventListener('load', function () {
            setTimeout(function () {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('fade-out');
                    setTimeout(function () { ls.remove(); }, 350);
                }
                document.body.style.overflow = 'auto';
            }, 450);
        });
    </script>
</body>

</html>
