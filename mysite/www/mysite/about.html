<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>درباره ما | دن‌روم</title>

    <style>
        @font-face { font-family: 'Peyda'; src: url('/assets/den_theme/css/Fonts/peyda-extralight.ttf') format('truetype'); font-weight: 200; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Peyda'; src: url('/assets/den_theme/css/Fonts/Peyda-Thin.ttf') format('truetype'); font-weight: 100; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Peyda'; src: url('/assets/den_theme/css/Fonts/peyda-light.ttf') format('truetype'); font-weight: 300; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Peyda'; src: url('/assets/den_theme/css/Fonts/Pevda-Reqular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Peyda'; src: url('/assets/den_theme/css/Fonts/Peyda-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Peyda'; src: url('/assets/den_theme/css/Fonts/Peyda-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Peyda'; src: url('/assets/den_theme/css/Fonts/Peyda-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Peyda'; src: url('/assets/den_theme/css/Fonts/Peyda-ExtraBold.ttf') format('truetype'); font-weight: 800; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Peyda'; src: url('/assets/den_theme/css/Fonts/Peyda-Black.ttf') format('truetype'); font-weight: 900; font-style: normal; font-display: swap; }

        * { font-family: 'Peyda', Tahoma, sans-serif !important; }
        body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #f5e4ce 0%, #f3ece3 42%, #fff 100%);
            z-index: 999999;
            transition: opacity 0.4s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-orb {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(123, 86, 58, 0.3);
            border-top-color: #c6884b;
            animation: spin 1s linear infinite;
            box-shadow: 0 14px 30px rgba(155, 103, 56, 0.2);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script type="module" crossorigin src="/assets/mysite/frontend/assets/index.js?v=1.0.1"></script>
    <link rel="stylesheet" href="/assets/mysite/frontend/assets/index.css?v=1.0.1">
    <meta name="description" content="درباره ما در دن‌روم؛ اطلاعات کامل این صفحه، معرفی محتوا و دسترسی سریع به بخش‌های مرتبط سایت." />
    <meta name="robots" content="index,follow" />
</head>
<body class="h-full">
    <div id="loading-screen">
        <div class="loading-orb"></div>
    </div>

    <div id="app" class="h-full"></div>

    <script>
        window._PAGE = 'about';
        {% for key in boot %}
        window["{{ key }}"] = {{ boot[key] | tojson }};
        {% endfor %}

        window.addEventListener('load', function () {
            setTimeout(function () {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('fade-out');
                    setTimeout(function () { ls.remove(); }, 400);
                }
                document.body.style.overflow = 'auto';
            }, 420);
        });
    </script>
</body>
</html>
