<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>دنروم | برای خانه‌ای دنج</title>

    <!-- Peyda Font (local) -->
    <style>
        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/peyda-extralight.ttf') format('truetype');
            font-weight: 200;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/peyda-light.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Pevda-Reqular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-ExtraBold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Black.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }
    </style>

    <style>
        * {
            font-family: 'Peyda', Tahoma, sans-serif !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 999999;
            transition: opacity 0.5s ease;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            width: 120px;
            height: auto;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.98);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

    <!-- Vue App Assets -->
    <script type="module" crossorigin src="/assets/mysite/frontend/assets/index.js?v=1.0.1"></script>
    <link rel="stylesheet" href="/assets/mysite/frontend/assets/index.css?v=1.0.1">
</head>

<body class="h-full">
    <!-- Loading Screen (Tesla Style) -->
    <div id="loading-screen">
        <div style="color: white; font-size: 2rem; font-weight: 900; letter-spacing: 0.3em;">DENROOM</div>
    </div>

    <!-- Vue App Mount Point -->
    <div id="app" class="h-full"></div>

    <!-- Boot Data from Frappe -->
    <script>
        window._PAGE = 'home';
        {% for key in boot %}
        window["{{ key }}"] = {{ boot[key] | tojson }};
        {% endfor %}
        window.addEventListener('load', function () {
            setTimeout(function () {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('fade-out');
                    setTimeout(function () { ls.remove(); }, 500);
                }
            }, 800);
        });
    </script>
</body>

</html>
