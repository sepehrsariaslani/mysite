<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>{{ product_name or 'محصول' }} | DenRoom</title>

    <!-- Peyda Font (local) -->
    <style>
        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/peyda-extralight.ttf');
            font-weight: 200;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Thin.ttf');
            font-weight: 100;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/peyda-light.ttf');
            font-weight: 300;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Pevda-Reqular.ttf');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Medium.ttf');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-SemiBold.ttf');
            font-weight: 600;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Bold.ttf');
            font-weight: 700;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-ExtraBold.ttf');
            font-weight: 800;
        }

        @font-face {
            font-family: 'Peyda';
            src: url('/assets/den_theme/css/Fonts/Peyda-Black.ttf');
            font-weight: 900;
        }

        * {
            font-family: 'Peyda', Tahoma, sans-serif !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: #fbf9f6;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #503130 0%, #3d2524 100%);
            z-index: 999999;
            transition: opacity 0.3s ease;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #f2c97e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- Vue App Assets -->
    <script type="module" crossorigin src="/assets/mysite/frontend/assets/index.js"></script>
    <link rel="stylesheet" href="/assets/mysite/frontend/assets/index.css">
    <meta name="description" content="{{ product_name or 'محصول' }} در دن‌روم؛ بررسی مشخصات، ابعاد، رنگ‌بندی و متریال محصول همراه با تصاویر و اطلاعات خرید." />
    <meta name="robots" content="index,follow" />
</head>

<body class="h-full">
    <div id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <div id="app" class="h-full"></div>

    <script>
        window._PAGE = '{{ page_type or "product" }}';
        {% for key in boot %}
        window["{{ key }}"] = {{ boot[key] | tojson }};
        {% endfor %}

        window.addEventListener('load', function () {
            setTimeout(function () {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('fade-out');
                    setTimeout(function () { ls.remove(); }, 300);
                }
            }, 400);
        });
    </script>
</body>

</html>
